    <canvas id="display"></canvas>

    <script>
        //var display = new Display(document.getElementById("display"));

        var renderer = new Timeline(document.getElementById("timeline"));


        // adds some initial elements

        //renderer.addElement(new sinBar(this.canvas));

        var node1 = new anchor(20, 20);
        var node2 = new anchor(210, 140);
        var handle1 = new handle(110, 150, node1);
        var handle2 = new handle(180, 10, node2);
        var curve1 = new curve(node1, handle1, handle2, node2, `rgba(204, 25, 25, 1)`);


        renderer.addElements([handle1, handle2  , node1 , node2 , curve1]);



        
        

        svg.loadImage("speachbubble.svg", ((el) => renderer.addElement(el)));



    </script>
