<!DOCTYPE html>
<html>

<head>
    <title>css animation tool</title>
    <link rel="icon" type="image/png" href="icon.png">
    <base href="/css_animation_tool/client/">
    <link href="stylesheet.css" rel="stylesheet">
    <script src="main.js" type="module"></script>
    <script src="https://kit.fontawesome.com/74093a2bd0.js" crossorigin="anonymous"></script>
</head>

<body>


    <h1 style="grid-column: 1 / 3;">
        <image src="icon.png" style=" height: 1em; aspect-ratio: 1;"></image> CSS ANIMATION TOOL
    </h1>
    <div style="grid-column: 1 / 3;" id="display"></div>
    <canvas style="grid-column: 2; grid-row: 3;" id="timelineCanvas"> </canvas>

    <div tabindex="0" id="object"></div>


    <div style="grid-column: 1; grid-row: 3;" id="timelineSidebar">
        <span id="topbar">
            <h4> target</h4>
            <select id="objectDropdown">
                <option value="object">object</option>
            </select>
            <input id="addObjectButton" type="button" value="+" class="fa-solid fa-plus">
        </span>
        <settings>
            <span>
                composition/blendmode
                <select id="blendmodeDropdown">
                    <option value="add">add (recommended)</option>
                    <option value="replace">replace (default)</option>
                    <option value="accumulate"> accumulate </option>
                </select>
            </span>
        </settings>

        <ul id="animVals">
            <li class="animVal" target="transform" targetFunction="translateX" name="tx" syntax="length"
                initialValue="0" typeExtention="px" color="purple"><input type="checkbox" />
                tx <colorSwatch></colorSwatch>
            </li>
            <li class="animVal" target="transform" targetFunction="translateY" name="ty" syntax="length"
                initialValue="0" typeExtention="px" color="green"><input type="checkbox" />
                ty <colorSwatch></colorSwatch>
            </li>
            <li class="animVal" target="transform" targetFunction="rotate" name="r" syntax="angle" initialValue="0"
                typeExtention="deg" color="blue"><input type="checkbox" />
                rotation <colorSwatch></colorSwatch>
            </li>
            <li class="animVal" target="transform" targetFunction="scaleX" name="scaleX" syntax="number"
                initialValue="1" typeExtention="" color="orange"><input type="checkbox" />
                scaleX <colorSwatch></colorSwatch>
            </li>
            <li class="animVal" target="transform" targetFunction="scaleY" name="scaleY" syntax="number"
                initialValue="1" typeExtention="" color="yellow"><input type="checkbox" />
                scaleY <colorSwatch></colorSwatch>
            </li>
        </ul>


        <!--button onclick="loadFromFile()"> load from file </button-->

        <span></span>

        <span id="bottombar">
            <input type="button" id="loadFileBtn" value="load file">
            <input type="button" id="saveFileBtn" value="save file">
            <input type="button" id="copyCssBtn" value="copy css to clipboard">
        </span>


        <!--form id="addObjectForm">
                <input type="text" id="newObjectId" name="id" placeholder="type 'id' of object">
                <input type="submit" value="add from id">
            </form-->
        <!--context-menu>
                <li> add
                <li>
                <li> remove
                <li>
            </context-menu-->
    </div>
    <div id="loading-icon"></div>

    <dialog  id="popup">
        <div id ="popupOptions">
            <button id="btn1">Option 1</button>
            <button id="btn2">Option 2</button>
            <button id="close-btn">Close</button>
        </div>
    </dialog >

</body>

</html>
