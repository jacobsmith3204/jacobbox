<!DOCTYPE html>
<html>

<head>
    <title>css animation tool</title>
    <base href="/css_animation_tool/client/">
    <link href="stylesheet.css" rel="stylesheet">
    <script src="main.js" type="module"></script>
    <script src="https://kit.fontawesome.com/74093a2bd0.js" crossorigin="anonymous"></script>
</head>

<body>
    <h1 style="grid-column: 1 / 3;"> CSS ANIMATION TOOL </h1>
    <div style="grid-column: 1 / 3;" id="display"></div>
    <canvas style="grid-column: 2; grid-row: 3;" id="timelineCanvas"> </canvas>

    <div tabindex="0" id="object"></div>


    <div style="grid-column: 1; grid-row: 3;" id="timelineSidebar">
        <span class="topbar">
            <h4>target</h4>
            <select id="objectDropdown">
                <option value="object">object</option>
            </select>
            <input type="button" value="+" class="fa-solid fa-plus"> 

            <form id="addObjectField">
                <input type="text" id="newObjectId" name="id" placeholder="type 'id' of object">
                <input type="submit" value="add from id">
            </form>
        </span>
        <settings>
            <span>
                composition/blendmode
                <select id="blendmodeDropdown">
                    <option value="add">add (recommended)</option>
                    <option value="replace">replace (default)</option>
                    <option value="accumulate"> accumulate </option>
                </select>
            </span>
        </settings>

        <ul id="animVals">
            <li class="animVal" name="tx" property="length" , default="0" extention="px"><input type="checkbox" />
                tx </li>
            <li class="animVal" name="ty" property="length" , default="0" extention="px"><input type="checkbox" />
                ty</li>
            <li class="animVal" name="r" property="angle" , default="0" extention="deg"><input type="checkbox" />
                rotation</li>
            <li class="animVal" name="scaleX" property="length" , default="0" extention="px"><input type="checkbox" />
                scaleX</li>
            <li class="animVal" name="scaleY" property="length" , default="0" extention="px"><input type="checkbox" />
                scaleY</li>
        </ul>

        <!--context-menu>
                <li> add
                <li>
                <li> remove
                <li>
            </context-menu-->
    </div>
</body>

</html>
