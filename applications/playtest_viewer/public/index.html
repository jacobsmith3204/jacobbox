<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Join Game - Jackbox Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./stylesheet.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script src="clientMirror.js"></script>
</head>

<body>
    <div class="game-container">
        <h1 id="globalMessage">you're in</h1> <!-- will update when a game starts, etc-->


  


        <form id="gameForm" name="gameForm">
            <div id="users">
            </div>
            
            <div id="display" style="height: min(10cqi, 10cqb);"></div>

            <div id="numpad">
                <span style="grid-column: 4 /span 1; grid-row: 2 /span 2;"><input type="button" name="#0" value="0"     ></span>
                <!--numbers-->
                <span style="grid-column: 1 /span 1; grid-row: 3 /span 1;"><input type="button" name="#1" value="1" ></span>
                <span style="grid-column: 2 /span 1; grid-row: 3 /span 1;"><input type="button" name="#2" value="2" ></span>
                <span style="grid-column: 3 /span 1; grid-row: 3 /span 1;"><input type="button" name="#3" value="3" ></span>
                <span style="grid-column: 1 /span 1; grid-row: 2 /span 1;"><input type="button" name="#4" value="4" ></span>
                <span style="grid-column: 2 /span 1; grid-row: 2 /span 1;"><input type="button" name="#5" value="5" ></span>
                <span style="grid-column: 3 /span 1; grid-row: 2 /span 1;"><input type="button" name="#6" value="6" ></span>
                <span style="grid-column: 1 /span 1; grid-row: 1 /span 1;"><input type="button" name="#7" value="7" ></span>
                <span style="grid-column: 2 /span 1; grid-row: 1 /span 1;"><input type="button" name="#8" value="8" ></span>
                <span style="grid-column: 3 /span 1; grid-row: 1 /span 1;"><input type="button" name="#9" value="9" ></span>
                <!-- special-->
                <span style="grid-column: 4 /span 1; grid-row: 1 /span 1;"><input type="button" name="del" value="DEL" ></span>
                <span style="grid-column: 1 /span 2; grid-row: 4 /span 1;"><input type="button" name="fizz" value="Fizz"></span>
                <span style="grid-column: 3 /span 2; grid-row: 4 /span 1;"><input type="button" name="buzz" value="Buzz"></span>
            </div>


            <span style="height: min(10cqi, 10cqb);"><input type="button" id="submit"  name="submit" value="Done"></span>
        </form>

        <div class="message" id="message"></div> <!-- used for debugging -->
    </div>

    <script src="game.js"></script>

</body>

</html>
